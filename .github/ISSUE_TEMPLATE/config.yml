blank_issues_enabled: false
contact_links:
  - name: Reporting a problem in the city (pothole, garbage, flooding)
    url: https://reports.davaocity.gov.ph
    about: >-
      This tracker is for the software only. To report a real problem to the
      city, use the reporting site itself, or https://bantaydabaw.org.
  - name: Something that looks like a security problem
    url: https://github.com/relaxdiego/dvo-reports/security/advisories/new
    about: >-
      Report it privately here, not as a public issue. This service handles
      citizens' locations, photos, and contact details.
