name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Do not cancel a running one: it would leave the site
# half published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: jetify-com/devbox-install-action@v0.13.0
        with:
          enable-cache: true

      - name: Build the site
        env:
          # Where the deployed frontend sends reports. Set this repository
          # variable to the backend's URL; see docs/deploy.md.
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: devbox run -- make build-frontend

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
