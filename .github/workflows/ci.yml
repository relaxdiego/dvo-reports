name: ci

# Checks and deploys live in one workflow because a deploy must wait for the
# checks, and `needs:` cannot reach across workflow files.
#
# The frontend is a static bundle on Cloudflare Pages. One project serves all
# three targets, told apart by the --branch given to wrangler:
#
#   push to main   -> staging     -> report-staging.relaxdiego.com
#   tag v*         -> production  -> report.relaxdiego.com
#   pull request   -> pr-<number> -> a throwaway preview URL
#
# VITE_API_BASE is baked in at build time, so each target is built on its
# own, with the value from the GitHub Environment named below.
#
# The backend is a container on Fly, one app per environment. It is not
# deployed for a pull request: a preview talks to the staging backend.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseding a pull request's run is free. Killing a run that is part way
  # through a deploy is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # devbox pins the same Go and Node versions developers get locally, so
      # a green run here means the same toolchain passed.
      - uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-

      - run: devbox run -- make lint
      - run: devbox run -- make test
      - run: devbox run -- make build

  deploy-backend:
    needs: check
    # No per-preview backend. A pull request preview talks to staging.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v7

      - uses: superfly/flyctl-actions/setup-flyctl@1.5

      # The app must already exist; creating it needs an account this
      # repository has no access to. See docs/deploy.md.
      - name: Deploy the backend
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Until the Fly apps and the token exist, say so loudly and stop.
          # A red main here would mean nothing a reader could act on, and the
          # secret cannot be checked from a job-level `if`.
          if [[ -z "$FLY_API_TOKEN" ]]; then
            echo "### Backend not deployed" >> "$GITHUB_STEP_SUMMARY"
            echo "\`FLY_API_TOKEN\` is not set on this environment, so the" \
              "backend was skipped. See docs/deploy.md." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            config=fly.production.toml
          else
            config=fly.staging.toml
          fi
          flyctl deploy --config "$config" --remote-only

  deploy:
    needs: check
    # Secrets are withheld from a pull request opened from a fork, so a
    # preview cannot work there. Skip it rather than show a contributor a red
    # check they have no way to fix.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: >-
        ${{ startsWith(github.ref, 'refs/tags/v') && 'production'
            || github.event_name == 'push' && 'staging'
            || 'preview' }}
    steps:
      - uses: actions/checkout@v7

      - name: Work out which target this is
        id: target
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "branch=production"
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            echo "branch=staging"
          else
            echo "branch=pr-${{ github.event.number }}"
          fi >> "$GITHUB_OUTPUT"

      - uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-

      # Rebuilt here rather than reused from `check`: the API base is baked
      # into the bundle, and each target has its own.
      - name: Build the site
        env:
          # Set VITE_API_BASE as a variable on the matching GitHub
          # Environment; see docs/deploy.md.
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: devbox run -- make build-frontend

      - name: Publish to Cloudflare Pages
        id: publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy frontend/dist
            --project-name=dvo-reports
            --branch=${{ steps.target.outputs.branch }}

      - name: Say where it went
        run: |
          echo "Deployed \`${{ steps.target.outputs.branch }}\` to ${{ steps.publish.outputs.deployment-url }}" \
            >> "$GITHUB_STEP_SUMMARY"
