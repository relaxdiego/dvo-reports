name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # devbox pins the same Go and Node versions developers get locally, so
      # a green run here means the same toolchain passed.
      - uses: jetify-com/devbox-install-action@v0.13.0
        with:
          enable-cache: true

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-

      - run: devbox run -- make lint
      - run: devbox run -- make test
      - run: devbox run -- make build
