name: ci

# Checks and deploys live in one workflow because a deploy must wait for the
# checks, and `needs:` cannot reach across workflow files.
#
# The frontend is a static bundle on Cloudflare Pages. One project serves
# every target, told apart by the --branch given to wrangler, and the branch
# is named after the environment:
#
#   staging     -> report-staging.relaxdiego.com
#   production  -> report.relaxdiego.com
#
# The backend is a container on Fly, one app per environment, named in
# backend/fly.<environment>.toml.
#
# Which environments a run deploys to is decided by the `targets` job below.
# VITE_API_BASE is baked into the bundle at build time, so each target is
# built on its own, with the value from its GitHub Environment.
#
# A pull request is checked and never deployed. Nothing from an unmerged
# branch reaches a server; review one by running it locally.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Superseding a pull request's run is free. A push queues instead, so
    # that two commits are never checked and deployed out of order.
    concurrency:
      group: check-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      # devbox pins the same Go and Node versions developers get locally, so
      # a green run here means the same toolchain passed.
      - uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-

      - run: devbox run -- make lint
      - run: devbox run -- make test
      - run: devbox run -- make build
      - run: devbox run -- make size

  # Which environments this run deploys to.
  #
  # Until the site is launched, the live one is meant to be whatever is on
  # main: nobody is using report.relaxdiego.com yet, so there is nothing for
  # a bad commit there to spoil, and waiting for a tag to see the real thing
  # only slows the work down.
  #
  # On launch day, set LAUNCHED to true. Production then moves only when a
  # v* tag is pushed, which is the arrangement docs/deploy.md describes.
  targets:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      LAUNCHED: 'false'
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - id: pick
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            list='["production"]'
          elif [[ "$LAUNCHED" == 'true' ]]; then
            list='["staging"]'
          else
            list='["staging", "production"]'
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "Deploying to: $list" >> "$GITHUB_STEP_SUMMARY"

  deploy-backend:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      # Production may sit at its approval gate for a while. Staging is not
      # made to wait with it, and neither is cancelled if the other fails.
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.list) }}
    environment:
      name: ${{ matrix.target }}
    # One deploy to an environment at a time. Grouping per environment
    # rather than per run means a job held at the approval gate holds up
    # only the environment it is waiting for.
    concurrency:
      group: deploy-backend-${{ matrix.target }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: superfly/flyctl-actions/setup-flyctl@1.5

      # The app must already exist; creating it needs an account this
      # repository has no access to. See docs/deploy.md.
      - name: Deploy the backend
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Until the Fly apps and the token exist, say so loudly and stop.
          # A red main here would mean nothing a reader could act on, and the
          # secret cannot be checked from a job-level `if`.
          if [[ -z "$FLY_API_TOKEN" ]]; then
            echo "### Backend not deployed to ${{ matrix.target }}" >> "$GITHUB_STEP_SUMMARY"
            echo "\`FLY_API_TOKEN\` is not set on this environment, so the" \
              "backend was skipped. See docs/deploy.md." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          flyctl deploy --config "fly.${{ matrix.target }}.toml" --remote-only

  deploy:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.list) }}
    environment:
      name: ${{ matrix.target }}
    concurrency:
      group: deploy-frontend-${{ matrix.target }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-

      # Rebuilt here rather than reused from `check`: the API base is baked
      # into the bundle, and each target has its own.
      - name: Build the site
        env:
          # Set VITE_API_BASE as a variable on the matching GitHub
          # Environment; see docs/deploy.md.
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: devbox run -- make build-frontend

      - name: Publish to Cloudflare Pages
        id: publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy frontend/dist
            --project-name=dvo-reports
            --branch=${{ matrix.target }}

      - name: Say where it went
        run: |
          echo "Deployed \`${{ matrix.target }}\` to ${{ steps.publish.outputs.deployment-url }}" \
            >> "$GITHUB_STEP_SUMMARY"
