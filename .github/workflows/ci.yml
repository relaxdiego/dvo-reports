name: ci

# Checks, one build, then staging, then production — all in one run. They live
# in one workflow file because each waits for the one before it, and `needs:`
# cannot reach across workflow files.
#
# The frontend is a static bundle on Cloudflare Pages. One project serves
# every target, told apart by the --branch given to wrangler, and the branch
# is named after the environment:
#
#   staging     -> staging.dvo-reports.pages.dev
#   production  -> dvo-reports.pages.dev
#
# The backend is a container on Fly, one app per environment, named in
# backend/fly.<environment>.toml.
#
# **Both halves are built once and the same bytes go to both environments.**
# Nothing about an environment is baked into either any more: the backend
# reads its config from fly.<environment>.toml when it is deployed, and the
# frontend reads its own from the <html> tag the deploy job writes into the
# copy it publishes. So what reaches a citizen is the artifact staging was
# tested with, not a second build of the same commit that could differ
# because a base image moved or a dependency resolved differently.
#
# Every push to main goes to staging on its own and then stops at the
# production Environment's reviewer gate. Approving is the one deliberate act
# between a commit and a citizen; nothing has to be dispatched by hand.
#
# A pull request is checked and never deployed. Nothing from an unmerged
# branch reaches a server; review one by running it locally.

on:
  push:
    branches: [main]
  pull_request:
  # No inputs. A dispatch runs the same path a push does — staging, then the
  # gate — on whichever ref is chosen. That is how a deploy is repeated after
  # a `fly secrets set`, and how an older commit is put back.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Superseding a pull request's run is free. A push queues instead, so
    # that two commits are never checked and deployed out of order.
    concurrency:
      group: check-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      # devbox pins the same Go and Node versions developers get locally, so
      # a green run here means the same toolchain passed.
      - uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-

      - run: devbox run -- make lint
      - run: devbox run -- make test
      - run: devbox run -- make build
      - run: devbox run -- make size

  # The one build. Everything after this publishes what this job produced.
  build:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For pushing the backend image to this repository's container
      # registry. The image is public, like the repository and the source it
      # is built from, so Fly needs no credentials to pull it.
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-

      # No DEPLOY_ENV and no VITE_API_BASE: this bundle is for both targets
      # and is told which it is when it is published, not when it is built.
      - name: Build the site
        run: devbox run -- make build-frontend

      # Kept for 30 days because that is how long a job can wait at the
      # production gate before GitHub cancels it. An artifact that expired
      # first would leave an approval that cannot be acted on.
      - name: Keep the site for the deploys
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: frontend/dist
          retention-days: 30

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: name
        run: |
          # Lowercased because a registry path must be, and a GitHub owner
          # need not be.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-api" >> "$GITHUB_OUTPUT"
          # The same rule frontend/vite.config.ts uses for the page's footer,
          # so the two halves' stamps can be compared by eye rather than by
          # prefix. Both are read off a phone screen.
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - id: build
        name: Build and push the backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          # There is no .git in the backend build context, so the binary
          # cannot work this out for itself. /healthz answers with it.
          build-args: BUILD_SHA=${{ steps.name.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # By digest, not by tag. A tag can be moved to other bytes afterwards;
      # a digest names the bytes staging is about to be tested with, and is
      # what production is deployed from days later.
      - id: ref
        run: |
          echo "image=${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}" \
            >> "$GITHUB_OUTPUT"
          echo "Built \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

  # Staging follows main on its own. Its steps and production's are deliberate
  # copies of each other rather than one shared action: what differs between
  # them is small and scattered, and a conditional per line would hide which
  # environment gets what. Change one and change the other.
  staging:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
    # Queues rather than cancels: nothing waits for approval here, so a
    # staging deploy is only ever a minute long and is worth finishing.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: superfly/flyctl-actions/setup-flyctl@1.5

      - name: Deploy the backend
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          # Until the Fly apps and the token exist, say so loudly and stop.
          # A red main here would mean nothing a reader could act on, and the
          # secret cannot be checked from a job-level `if`.
          if [[ -z "$FLY_API_TOKEN" ]]; then
            echo "### Backend not deployed to staging" >> "$GITHUB_STEP_SUMMARY"
            echo "\`FLY_API_TOKEN\` is not set on this environment, so the" \
              "backend was skipped. See docs/deploy.md." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # No build here. ALLOWED_ORIGINS and UPSTREAM come from the config
          # file and are applied to the machine, not compiled into the image.
          flyctl deploy --config fly.staging.toml --image "$IMAGE"

      - name: Fetch the site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Say which environment this copy is
        env:
          API: ${{ vars.VITE_API_BASE }}
        run: ./.github/scripts/name-environment.sh dist staging "$API"

      - name: Publish to Cloudflare Pages
        id: publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=dvo-reports
            --branch=staging

      - name: Say where it went
        run: |
          echo "Deployed \`staging\` to ${{ steps.publish.outputs.deployment-url }}" \
            >> "$GITHUB_STEP_SUMMARY"

  # Production. The Environment's reviewer gate holds this job until somebody
  # approves it; GitHub cancels the run if nobody does within 30 days.
  production:
    needs: [build, staging]
    runs-on: ubuntu-latest
    environment:
      name: production
    # Unlike staging's, this cancels rather than queues. Every push leaves a
    # job here waiting to be approved, and a waiting job holds the group: with
    # `false`, the oldest unapproved run blocks every newer one from even
    # reaching the gate, so the approval an approver is offered is always the
    # stalest. Cancelling means the newest run is the one waiting, which is
    # the one worth approving.
    #
    # What this gives up is that a push landing while production is actually
    # deploying will cancel that deploy. The window is the minute or two after
    # an approval, against a queue that jammed on every second push.
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      # Every push to main leaves a job waiting here, so more than one can be
      # waiting at once and the newest is not always the one an approver
      # opens. Approving a superseded run would quietly put an older commit
      # in front of citizens, and the only trace would be the sha in the
      # page's footer.
      #
      # Only on a push. A dispatch is somebody choosing a ref on purpose,
      # which is how an older commit is deliberately put back.
      - name: Refuse a build that main has moved past
        if: github.event_name == 'push'
        run: |
          # FETCH_HEAD rather than origin/main: checkout makes a shallow,
          # single-branch clone, and whether it keeps a remote-tracking ref
          # for main depends on the refspec it configured.
          git fetch --depth=1 origin main
          tip="$(git rev-parse FETCH_HEAD)"
          if [[ "$tip" != "$GITHUB_SHA" ]]; then
            echo "main is now $tip, but this run built $GITHUB_SHA." >&2
            echo "Approve the newest run instead of this one." >&2
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@1.5

      - name: Deploy the backend
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          if [[ -z "$FLY_API_TOKEN" ]]; then
            echo "### Backend not deployed to production" >> "$GITHUB_STEP_SUMMARY"
            echo "\`FLY_API_TOKEN\` is not set on this environment, so the" \
              "backend was skipped. See docs/deploy.md." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The same digest staging has been running.
          flyctl deploy --config fly.production.toml --image "$IMAGE"

      - name: Fetch the site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Say which environment this copy is
        env:
          API: ${{ vars.VITE_API_BASE }}
        run: ./.github/scripts/name-environment.sh dist production "$API"

      - name: Publish to Cloudflare Pages
        id: publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=dvo-reports
            --branch=production

      - name: Say where it went
        run: |
          echo "Deployed \`production\` to ${{ steps.publish.outputs.deployment-url }}" \
            >> "$GITHUB_STEP_SUMMARY"
