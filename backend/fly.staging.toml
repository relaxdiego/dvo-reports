# Staging backend. See docs/deploy.md.
#
# The app has to exist before CI can deploy to it; creating it is a one-time
# manual step, because it needs an account this repository has no access to.

app = "dvo-reports-api-staging"
# Singapore is the closest Fly region to Davao.
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  # Exact matches only, so every origin the browser app is served from has to
  # be listed. That is the Cloudflare Pages branch alias, and stays so until a
  # custom domain is chosen, which changes this line with it.
  ALLOWED_ORIGINS = "https://staging.dvo-reports.pages.dev"

  # Staging reads the city for real — the one-time code, past reports, what
  # became of one — and files nothing. Their database is not a test
  # environment, and a practice report there is work for the people who staff
  # their queue. A submission here comes back as NOT-FILED-nnnn.
  UPSTREAM = "nosubmit"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero. A cold start is a fraction of a second and the city's own
  # API is slower than that. Set min_machines_running = 1 to buy it back.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
