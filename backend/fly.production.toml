# Production backend. See docs/deploy.md.
#
# The app has to exist before CI can deploy to it; creating it is a one-time
# manual step, because it needs an account this repository has no access to.

app = "dvo-reports-api"
# Singapore is the closest Fly region to Davao.
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  # Exact matches only. The first is the address citizens are given; the
  # second is the Pages project's production alias, which is what the domain
  # is a name for and is still in links people hold. Both serve the same
  # bytes, so a browser on either has to be allowed to submit.
  #
  # dvo-reports.pages.dev is deliberately not here. That project serves one
  # 301 and no page, so nothing on it ever calls this API.
  ALLOWED_ORIGINS = "https://bantaydabaw.org,https://bantaydabaw.pages.dev"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero. A cold start is a fraction of a second and the city's own
  # API is slower than that. Set min_machines_running = 1 to buy it back.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
